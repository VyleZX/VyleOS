# UEFI Boot Configuration

[boot]
# Boot entry name
name = "AuroraOS"

# Default boot timeout in seconds
timeout = 5

# Kernel path on EFI system partition
kernel_path = "\\EFI\\auroraos\\kernel.efi"

# Initial ramdisk (optional)
# initrd_path = "\\EFI\\auroraos\\initrd.img"

# Command line arguments
cmdline = "log_level=info debug=false"

[display]
# Resolution (0,0 = auto-detect)
width = 1920
height = 1080

# Color depth
depth = 32

[memory]
# Minimum required memory in MB
min_memory = 512

# Recommended memory in MB
recommended_memory = 2048

[security]
# Enable secure boot verification
secure_boot = true

# Require signed kernel modules
signed_modules = true
