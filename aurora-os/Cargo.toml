[workspace]
members = [
    "kernel",
    "userspace/init",
    "userspace/compositor",
    "userspace/wm",
    "userspace/gui-framework",
    "filesystems/vfs",
    "networking/stack",
    "graphics/compositor",
    "security/sandbox",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
